services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: car_parts
      POSTGRES_USER: car_parts
      POSTGRES_PASSWORD: car_parts
    ports:
      - "5432:5432"
    volumes:
      - car_parts_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U car_parts -d car_parts"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  car_parts_postgres:
