spring:
  application:
    name: car-parts-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/car_parts}
    username: ${DB_USERNAME:car_parts}
    password: ${DB_PASSWORD:car_parts}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  address: ${BIND_ADDRESS:127.0.0.1}
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    session-hours: ${AUTH_SESSION_HOURS:12}
    secure-cookie: ${AUTH_SECURE_COOKIE:false}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-username: ${BOOTSTRAP_ADMIN_USERNAME:manager0}
    admin-phone: ${BOOTSTRAP_ADMIN_PHONE:+10000000000}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    admin-name: ${BOOTSTRAP_ADMIN_NAME:مدیر صفر}
